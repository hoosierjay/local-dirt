name: Run Local-Dirt Scrape and Report script

permissions:
  contents: write
  issues: write

# Define what triggers the workflow
on:
  schedule:
    # Runs daily at 21:30 UTC (after US market close)
    - cron: '30 21 * * *'
  workflow_dispatch:  # Adds a manual "Run workflow" button in GitHub

jobs:
  run-script:
    runs-on: ubuntu-latest  # The virtual machine environment

    steps:
      # Step 1: Download your repository code onto the virtual machine
      - name: Checkout Code on VM 
        uses: actions/checkout@v4

      # Step 2: Install Python on the virtual machine
      - name: Set up Python on VM 
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Specify your required Python version

      # Step 3: Install dependencies (optional but recommended)
      - name: Install Dependencies for Python Scripts
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Step 4: Execute your script
      - name: Run Python Script to Generate Digest
        run: python local_dirt.py  

      # Step 5: Commit and push the output file
      - name: Commit and Push Digest Output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add output/digest_latest.json
          git diff --cached --quiet || git commit -m "Update output file"
          git push

      # Step 6: Ask Groq to select and draft posts from the latest digest
      - name: Run Python Script to Generate AI Analysis
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
        run: python local_dirt_ai_report.py

      # Step 7: Commit and push the report to the output folder
      - name: Commit and Push AI Analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add output/report_latest.md
          git diff --cached --quiet || git commit -m "Update report"
          git pull --rebase
          git push

      # Step 8: Open an issue with the report; GitHub emails it to the assignee
      - name: Email the AI Analysis Report to the Repository Owner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Local Dirt report $(date -u +%Y-%m-%d)" \
            --body-file output/report_latest.md \
            --assignee "${{ github.repository_owner }}"
