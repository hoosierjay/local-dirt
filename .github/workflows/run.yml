name: Run Local-Dirt Scrape and Report script

permissions:
  contents: write

# Define what triggers the workflow
on:
  schedule:
    # Runs daily at 21:30 UTC (after US market close)
    - cron: '30 21 * * *'
  workflow_dispatch:  # Adds a manual "Run workflow" button in GitHub

jobs:
  run-script:
    runs-on: ubuntu-latest  # The virtual machine environment

    steps:
      # Step 1: Download your repository code onto the virtual machine
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install Python on the virtual machine
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Specify your required Python version

      # Step 3: Install dependencies (optional but recommended)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Step 4: Execute your script
      - name: Run Python Script
        run: python local_dirt.py  

      # Step 5: Commit and push the output file
      - name: Commit and Push Output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add output/digest_latest.json

          git diff --cached --quiet || git commit -m "Update output file"

          git push

      # Step 6: Ask Gemini to select and draft posts from the latest digest
      - name: Generate Gemini Report
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          api_key = os.environ.get("GOOGLE_API_KEY")
          if not api_key:
              raise SystemExit("The GOOGLE_API_KEY repository secret is required.")

          digest_path = Path("output/digest_latest.json")
          digest = json.loads(digest_path.read_text(encoding="utf-8"))
          prompt = """Act as the editor of a concise Southside Indianapolis local-news account.
          Do not summarize everything. Review every item in this JSON, merge duplicate
          stories, and choose only items that a meaningful number of Southside residents
          would care about. Prioritize major development, roads/closures, restaurants
          and recognizable businesses, taxes, schools, school-board decisions, public
          safety, major local government decisions, significant sports results and
          unusual community news. When in doubt, skip it. For each selected item, give
          me a short X/Facebook-ready post and preserve the original source URL."""

          payload = {
              "contents": [{
                  "parts": [
                      {"text": prompt},
                      {
                          "text": (
                              "Review the contents of output/digest_latest.json:\n"
                              + json.dumps(digest, ensure_ascii=False)
                          )
                      },
                  ]
              }]
          }
          request = Request(
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-2.5-flash:generateContent",
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": api_key,
              },
              method="POST",
          )
          with urlopen(request, timeout=120) as response:
              result = json.load(response)

          candidates = result.get("candidates", [])
          if not candidates:
              raise SystemExit(
                  "Gemini returned no candidates: "
                  + json.dumps(result.get("promptFeedback", result), ensure_ascii=False)
              )

          text = "".join(
              part.get("text", "")
              for part in candidates[0].get("content", {}).get("parts", [])
          ).strip()
          if not text:
              raise SystemExit("Gemini returned an empty report.")

          report_path = Path("output/gemini_latest.md")
          report_path.write_text(text + "\n", encoding="utf-8")
          PY

      - name: Upload Gemini Report
        uses: actions/upload-artifact@v4
        with:
          name: gemini-report
          path: output/gemini_latest.md
          if-no-files-found: error
          retention-days: 14
          