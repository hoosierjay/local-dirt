name: Run Local-Dirt Scrape and Report script

permissions:
  contents: write

# Define what triggers the workflow
on:
  schedule:
    # Runs daily at 21:30 UTC (after US market close)
    - cron: '30 21 * * *'
  workflow_dispatch:  # Adds a manual "Run workflow" button in GitHub

jobs:
  run-script:
    runs-on: ubuntu-latest  # The virtual machine environment

    steps:
      # Step 1: Download your repository code onto the virtual machine
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install Python on the virtual machine
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Specify your required Python version

      # Step 3: Install dependencies (optional but recommended)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Step 4: Execute your script
      - name: Run Python Script
        run: python local_dirt.py  

      # Step 5: Commit and push the output file
      - name: Commit and Push Output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add output/digest_latest.json

          git diff --cached --quiet || git commit -m "Update output file"

          git push

      # Step 6: Ask AI to select and draft posts from the latest digest
      - name: Generate Report
        env:
           # GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}  #using Mistral API instead of Gemini
           MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError  

          api_key = os.environ.get("MISTRAL_API_KEY")
          if not api_key:
              raise SystemExit("The MISTRAL_API_KEY repository secret is required.")

          digest_path = Path("output/digest_latest.json")
          digest = json.loads(digest_path.read_text(encoding="utf-8"))
          prompt = """Act as the editor of a concise Forsyth County local-news account.
          Do not summarize everything. Review every item in this JSON, merge duplicate
          stories, and choose only items that a meaningful number of Forsyth County residents
          would care about. Prioritize major development, roads/closures, restaurants
          and recognizable businesses, taxes, schools, school-board decisions, public
          safety, major local government decisions, significant sports results and
          unusual community news. When in doubt, skip it. For each selected item, give
          me a short X/Facebook-ready post and preserve the original source URL."""

          payload = {
              "model": "mistral-large-latest",
              "temperature": 0.3,
              "messages": [
                  {"role": "system", "content": prompt},
                  {
                      "role": "user",
                      "content": (
                          "Review the contents of output/digest_latest.json:\n"
                          + json.dumps(digest, ensure_ascii=False)
                      ),
                  },
              ],
          }
          request = Request(
              "https://api.mistral.ai/v1/chat/completions",
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "Authorization": f"Bearer {api_key}",
                  # Some API gateways reject urllib's default User-Agent.
                  "User-Agent": "local-dirt-workflow/1.0",
              },
              method="POST",
          )
          try:
              with urlopen(request, timeout=180) as response:
                  result = json.load(response)
          except HTTPError as e:
              raise SystemExit(f"Mistral API error {e.code}: {e.read().decode('utf-8', 'ignore')}")

          choices = result.get("choices", [])
          if not choices:
              raise SystemExit("Mistral returned no choices: " + json.dumps(result, ensure_ascii=False))

          text = (choices[0].get("message", {}).get("content") or "").strip()
          if not text:
              raise SystemExit("Mistral returned an empty report.")

          Path("output/report_latest.md").write_text(text + "\n", encoding="utf-8")
          PY

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: ai-report
          path: output/report_latest.md
          if-no-files-found: error
          retention-days: 14
          